receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4316
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  otlphttp/metrics:
    endpoint: prometheus:9090/api/v1/otlp
  otlphttp/traces:
    endpoint: tempo:3200
  otlphttp/logs:
    endpoint: loki:3100/otlp

  debug/metrics:
    verbosity: detailed
  debug/traces:
    verbosity: detailed
  debug/logs:
    verbosity: detailed
  nop:

processors:
  batch:

extensions:
  health_check:
  zpages:
    endpoint: :55679

service:
  extensions: [zpages, health_check]

  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/metrics]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/traces]
    logs/otlp:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/logs]
