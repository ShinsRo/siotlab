services:
  otel-collector:
    image: otel/opentelemetry-collector:${OTEL_COLLECTOR_VERSION}
    restart: always
    command:
    - --config=/etc/otel-collector-config.yml
    volumes:
      - ./volumes/etc/otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "${OTEL_COLLECTOR_OTLP_HTTP_PORT:-4316}:4316"   # OTLP http receiver
      - "${OTEL_COLLECTOR_OTLP_GRPC_PORT:-4317}:4317"   # OTLP gRPC receiver
      - "${OTEL_COLLECTOR_ZPAGES_PORT:-55679}:55679"    # zpages extension
      - "${OTEL_COLLECTOR_HEALTH_PORT:-13133}:13133"    # health_check extension
