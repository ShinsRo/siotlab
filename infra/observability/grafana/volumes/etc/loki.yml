# 스키마 참고: https://json.schemastore.org/loki.json
target: all

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 3101

  log_level: warn
  log_format: logfmt

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      rules_directory: /loki/rules
      chunks_directory: /loki/chunks
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

ingester:
  max_chunk_age: 8h
  chunk_idle_period: 4h

schema_config:
  configs:
  - from: 2024-10-08
    store: tsdb
    object_store: filesystem
    schema: v13
    index:
      prefix: idx_
      period: 24h

ruler:
  alertmanager_url: http://localhost:9093
