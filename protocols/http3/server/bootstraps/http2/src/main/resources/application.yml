spring:
  application:
    name: http2-server

server:
  port: 8443
  shutdown: graceful
  ssl:
    enabled: true
    key-store: classpath:certs/http2.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: http2
  http2:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
