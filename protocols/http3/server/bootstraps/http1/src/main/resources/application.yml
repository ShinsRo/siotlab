spring:
  application:
    name: http1-server

server:
  port: 8080
  shutdown: graceful
  ssl:
    enabled: true
    key-store: classpath:certs/http1.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: http1
  http2:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
