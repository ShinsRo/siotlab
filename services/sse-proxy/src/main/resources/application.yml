spring.application.name: scg-sse

server:
  http2.enabled: true

spring:
  data:
    redis:
      host: localhost
      port: 6379

otel:
  exporter.otlp:
    protocol: grpc
    endpoint: http://localhost:4317

management:
  otlp:
    metrics:
      export:
        url: http://localhost:4316

logging:
  level:
    io.opentelemetry: debug
